<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DongMi Archives</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff5fb;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #ff8fc7, #b78cff);
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .search {
      padding: 20px;
      text-align: center;
    }

    .search input {
      width: 100%;
      max-width: 500px;
      padding: 14px 18px;
      border: none;
      border-radius: 30px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      font-size: 15px;
      outline: none;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 10px 20px 40px;
    }

    .section-title {
      font-size: 22px;
      margin: 20px 0;
    }

    .empty {
      background: white;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .empty p {
      color: #777;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌸 DongMi Archives</h1>
    <p>Manhwa & Novel Translation Archive</p>
  </header>

  <div class="search">
    <input
      type="text"
      placeholder="🔍 Cari judul..."
    >
  </div>

  <main class="container">

    <h2 class="section-title">📚 Latest Update</h2>

    <div class="empty">
      <div class="empty-icon">📖</div>
      <p>
        Belum ada judul yang ditambahkan.<br>
        Chapter dan judul akan muncul di sini.
      </p>
    </div>

  </main>

  <footer>
    © 2026 DongMi Archives
  </footer>

</body>
</html>
